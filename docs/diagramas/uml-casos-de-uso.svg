<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 910" width="100%" role="img" aria-label="Diagrama de Casos de Uso - WhereToGo">
  <defs>
    <marker id="arrow-include" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6CB4B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <style>
      .ator-linha { fill: none; stroke: #8FA88E; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ator-texto { font-family: Arial, Helvetica, sans-serif; font-size: 11.5px; fill: #FFFFFF; text-anchor: middle; }
      .uc-oval { fill: #000000; stroke: #111111; stroke-width: 1; }
      .uc-texto { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #FFFFFF; text-anchor: middle; }
      .assoc { fill: none; stroke: #7AB8BC; stroke-width: 1.15; opacity: 0.9; }
      .include-linha { fill: none; stroke: #6CB4B8; stroke-width: 1.15; stroke-dasharray: 4 3; marker-end: url(#arrow-include); }
      .include-texto { font-family: Arial, Helvetica, sans-serif; font-size: 9.5px; fill: #4E9398; text-anchor: middle; stroke: #FFFFFF; stroke-width: 3px; paint-order: stroke; }
    </style>
  </defs>

  <!-- Moldura externa e fundo preto fiel ao DVP original -->
  <rect x="1" y="1" width="818" height="908" fill="#FFFFFF" stroke="#222222" stroke-width="1" />
  <rect x="12" y="12" width="796" height="886" fill="#000000" />

  <!-- Fronteira do Sistema WhereToGo -->
  <rect x="208" y="32" width="584" height="850" fill="#FFFFFF" stroke="#6CB4B8" stroke-width="1.2" />
  <text x="500" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6CB4B8">WhereToGo</text>

  <!-- Divisória sutil entre Frente Pública e Painel Interno -->
  <line x1="224" y1="370" x2="520" y2="370" stroke="#CFE3E4" stroke-width="1" stroke-dasharray="4 3" />
  <text x="226" y="383" font-family="Arial, Helvetica, sans-serif" font-size="9" font-style="italic" fill="#6CB4B8">Painel Administrativo Interno (requer autenticação)</text>

  <!-- ================= ATORES (6 papéis reais) ================= -->
  <!-- 1. Cidadão Afetado -->
  <g transform="translate(102, 66)">
    <circle cx="0" cy="10" r="10" class="ator-linha" />
    <line x1="0" y1="20" x2="0" y2="40" class="ator-linha" />
    <line x1="-15" y1="28" x2="15" y2="28" class="ator-linha" />
    <line x1="0" y1="40" x2="-11" y2="56" class="ator-linha" />
    <line x1="0" y1="40" x2="11" y2="56" class="ator-linha" />
    <text x="0" y="72" class="ator-texto">Cidadão Afetado</text>
  </g>

  <!-- 2. Doador -->
  <g transform="translate(102, 186)">
    <circle cx="0" cy="10" r="10" class="ator-linha" />
    <line x1="0" y1="20" x2="0" y2="40" class="ator-linha" />
    <line x1="-15" y1="28" x2="15" y2="28" class="ator-linha" />
    <line x1="0" y1="40" x2="-11" y2="56" class="ator-linha" />
    <line x1="0" y1="40" x2="11" y2="56" class="ator-linha" />
    <text x="0" y="72" class="ator-texto">Doador</text>
  </g>

  <!-- 3. Voluntário Local -->
  <g transform="translate(102, 376)">
    <circle cx="0" cy="10" r="10" class="ator-linha" />
    <line x1="0" y1="20" x2="0" y2="40" class="ator-linha" />
    <line x1="-15" y1="28" x2="15" y2="28" class="ator-linha" />
    <line x1="0" y1="40" x2="-11" y2="56" class="ator-linha" />
    <line x1="0" y1="40" x2="11" y2="56" class="ator-linha" />
    <text x="0" y="72" class="ator-texto">Voluntário Local</text>
  </g>

  <!-- 4. Coordenador de Abrigo -->
  <g transform="translate(102, 512)">
    <circle cx="0" cy="10" r="10" class="ator-linha" />
    <line x1="0" y1="20" x2="0" y2="40" class="ator-linha" />
    <line x1="-15" y1="28" x2="15" y2="28" class="ator-linha" />
    <line x1="0" y1="40" x2="-11" y2="56" class="ator-linha" />
    <line x1="0" y1="40" x2="11" y2="56" class="ator-linha" />
    <text x="0" y="72" class="ator-texto">Coordenador</text>
    <text x="0" y="85" class="ator-texto">de Abrigo</text>
  </g>

  <!-- 5. Defesa Civil Municipal -->
  <g transform="translate(102, 650)">
    <circle cx="0" cy="10" r="10" class="ator-linha" />
    <line x1="0" y1="20" x2="0" y2="40" class="ator-linha" />
    <line x1="-15" y1="28" x2="15" y2="28" class="ator-linha" />
    <line x1="0" y1="40" x2="-11" y2="56" class="ator-linha" />
    <line x1="0" y1="40" x2="11" y2="56" class="ator-linha" />
    <text x="0" y="72" class="ator-texto">Defesa Civil</text>
    <text x="0" y="85" class="ator-texto">Municipal</text>
  </g>

  <!-- 6. Administrador Geral -->
  <g transform="translate(102, 782)">
    <circle cx="0" cy="10" r="10" class="ator-linha" />
    <line x1="0" y1="20" x2="0" y2="40" class="ator-linha" />
    <line x1="-15" y1="28" x2="15" y2="28" class="ator-linha" />
    <line x1="0" y1="40" x2="-11" y2="56" class="ator-linha" />
    <line x1="0" y1="40" x2="11" y2="56" class="ator-linha" />
    <text x="0" y="72" class="ator-texto">Administrador</text>
    <text x="0" y="85" class="ator-texto">Geral</text>
  </g>

  <!-- ================= ASSOCIAÇÕES ATOR -> CASO DE USO ================= -->
  <!-- Cidadão Afetado (port: 124, 96) -->
  <path d="M 124 94 C 170 94, 185 94, 233 94" class="assoc" />
  <path d="M 124 98 C 175 110, 185 148, 233 154" class="assoc" />
  <path d="M 124 102 C 170 150, 182 260, 233 274" class="assoc" />
  <path d="M 124 106 C 166 175, 180 315, 233 334" class="assoc" />

