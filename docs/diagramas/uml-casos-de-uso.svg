  <path d="M 124 530 C 172 480, 186 426, 233 418" class="assoc" />
  <path d="M 124 534 C 172 505, 188 478, 233 474" class="assoc" />
  <path d="M 124 538 C 174 536, 188 534, 233 534" class="assoc" />
  <path d="M 124 542 C 174 562, 188 588, 233 594" class="assoc" />
  <path d="M 124 546 C 172 592, 186 644, 233 652" class="assoc" />
  <path d="M 124 550 C 170 622, 184 700, 233 712" class="assoc" />
  <path d="M 124 554 C 168 650, 182 758, 233 772" class="assoc" />
  <path d="M 124 558 C 166 680, 180 816, 233 830" class="assoc" />

  <!-- Defesa Civil Municipal (port: 124, 678) -->
  <path d="M 124 670 C 176 610, 188 552, 233 538" class="assoc" />
  <path d="M 124 674 C 176 636, 188 606, 233 598" class="assoc" />
  <path d="M 124 678 C 176 668, 190 658, 233 656" class="assoc" />
  <path d="M 124 682 C 176 698, 190 712, 233 716" class="assoc" />
  <path d="M 124 686 C 176 726, 188 764, 233 776" class="assoc" />

  <!-- Administrador Geral (port: 124, 810) -->
  <path d="M 124 800 C 170 630, 182 440, 233 422" class="assoc" />
  <path d="M 124 803 C 172 655, 184 495, 233 480" class="assoc" />
  <path d="M 124 806 C 174 685, 186 555, 233 542" class="assoc" />
  <path d="M 124 809 C 174 715, 186 615, 233 602" class="assoc" />
  <path d="M 124 812 C 176 742, 188 672, 233 660" class="assoc" />
  <path d="M 124 815 C 176 768, 188 728, 233 720" class="assoc" />
  <path d="M 124 818 C 176 794, 190 780, 233 778" class="assoc" />
  <path d="M 124 822 C 176 830, 190 834, 233 836" class="assoc" />

  <!-- ================= RELACIONAMENTOS «include» -> GERENCIAR LOGIN ================= -->
  <path d="M 497 414 L 614 598" class="include-linha" />
  <text x="554" y="498" class="include-texto">«include»</text>

  <path d="M 497 474 L 604 602" class="include-linha" />
  <text x="550" y="534" class="include-texto">«include»</text>

  <path d="M 497 534 L 594 608" class="include-linha" />
  <text x="546" y="568" class="include-texto">«include»</text>

  <path d="M 497 594 L 588 616" class="include-linha" />
  <text x="544" y="602" class="include-texto">«include»</text>

  <path d="M 497 654 L 588 632" class="include-linha" />
  <text x="544" y="646" class="include-texto">«include»</text>

  <path d="M 497 714 L 594 640" class="include-linha" />
  <text x="546" y="680" class="include-texto">«include»</text>

  <path d="M 497 774 L 604 646" class="include-linha" />
  <text x="550" y="714" class="include-texto">«include»</text>

  <path d="M 497 834 L 614 650" class="include-linha" />
  <text x="554" y="750" class="include-texto">«include»</text>

  <!-- ================= CASOS DE USO (OVAIS PRETOS) ================= -->
  <!-- Públicos -->
  <ellipse cx="365" cy="94" rx="132" ry="23" class="uc-oval" />
  <text x="365" y="91" class="uc-texto">Visualizar Mapa Interativo</text>
  <text x="365" y="104" class="uc-texto">(Tempo Real SSE / PWA 3G)</text>

  <ellipse cx="365" cy="154" rx="132" ry="23" class="uc-oval" />
  <text x="365" y="151" class="uc-texto">Visualizar Detalhes do Abrigo</text>
  <text x="365" y="164" class="uc-texto">(Vagas, Rotas e PIX EMVCo)</text>

  <ellipse cx="365" cy="214" rx="132" ry="23" class="uc-oval" />
  <text x="365" y="211" class="uc-texto">Filtrar Abrigos por Necessidade</text>
  <text x="365" y="224" class="uc-texto">(Roteamento PostGIS)</text>

  <ellipse cx="365" cy="274" rx="132" ry="23" class="uc-oval" />
  <text x="365" y="271" class="uc-texto">Buscar Familiar Acolhido</text>
  <text x="365" y="284" class="uc-texto">(LGPD)</text>

  <ellipse cx="365" cy="334" rx="132" ry="23" class="uc-oval" />
  <text x="365" y="338" class="uc-texto">Reportar Ocorrência Cidadã</text>

  <!-- Internos (RBAC) -->
  <ellipse cx="365" cy="414" rx="132" ry="23" class="uc-oval" />
  <text x="365" y="411" class="uc-texto">Gerenciar Inventário</text>
  <text x="365" y="424" class="uc-texto">(Fast-CRUD / Estorno / Fila 3G)</text>

  <ellipse cx="365" cy="474" rx="132" ry="23" class="uc-oval" />
  <text x="365" y="471" class="uc-texto">Gerenciar Necessidades</text>
  <text x="365" y="484" class="uc-texto">(Urgente / Bloqueado / Mínimo)</text>

  <ellipse cx="365" cy="534" rx="132" ry="23" class="uc-oval" />
  <text x="365" y="531" class="uc-texto">Visualizar Dashboard de Triagem</text>
  <text x="365" y="544" class="uc-texto">(Sugestões de Troca)</text>

  <ellipse cx="365" cy="594" rx="132" ry="23" class="uc-oval" />
  <text x="365" y="591" class="uc-texto">Gerenciar Abrigados e</text>
  <text x="365" y="604" class="uc-texto">Transferências (Individual / Lote)</text>

  <ellipse cx="365" cy="654" rx="132" ry="23" class="uc-oval" />
  <text x="365" y="651" class="uc-texto">Gerenciar Infraestrutura,</text>
  <text x="365" y="664" class="uc-texto">Áreas de Risco e Moderação</text>

  <ellipse cx="365" cy="714" rx="132" ry="23" class="uc-oval" />
