  <text x="365" y="724" class="uc-texto">e Relatórios (FIDE / CSV)</text>

  <ellipse cx="365" cy="774" rx="132" ry="23" class="uc-oval" />
  <text x="365" y="771" class="uc-texto">Consultar Auditoria Imutável</text>
  <text x="365" y="784" class="uc-texto">e Histórico de Estoque</text>

  <ellipse cx="365" cy="834" rx="132" ry="23" class="uc-oval" />
  <text x="365" y="831" class="uc-texto">Gerenciar Abrigos, Catálogo</text>
  <text x="365" y="844" class="uc-texto">e Usuários da Equipe</text>

  <!-- Gerenciar Login (Alvo dos includes) -->
  <ellipse cx="682" cy="624" rx="94" ry="27" class="uc-oval" />
  <text x="682" y="621" class="uc-texto">Gerenciar Login</text>
  <text x="682" y="634" class="uc-texto">(RBAC / Google One Tap)</text>
