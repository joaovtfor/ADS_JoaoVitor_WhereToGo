  <path d="M 124 206 C 172 175, 186 105, 233 98" class="assoc" />
  <path d="M 124 210 C 172 192, 186 164, 233 158" class="assoc" />
  <path d="M 124 216 C 172 216, 188 214, 233 214" class="assoc" />

