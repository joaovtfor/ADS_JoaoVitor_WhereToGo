services:
  # ---------------------------------------------------------------------------
  # Aplicação Full-Stack (Next.js 16 + Node.js 22)
  # ---------------------------------------------------------------------------
  app:
    container_name: wheretogo_app
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: runner # Para desenvolvimento use o override: docker-compose.dev.yml
      args:
        NODE_VERSION: 22-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-wheretogo_db}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - wheretogo-net

  # ---------------------------------------------------------------------------
  # Job one-shot: aplica as migrations (db/migrations) antes de subir a app
  # ---------------------------------------------------------------------------
  migrate:
    container_name: wheretogo_migrate
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: migrator
      args:
        NODE_VERSION: 22-alpine
    restart: "no"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-wheretogo_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wheretogo-net

  # ---------------------------------------------------------------------------
  # Banco de Dados Relacional (PostgreSQL 16 + PostGIS 3.4)
  # ---------------------------------------------------------------------------
  postgres:
    container_name: wheretogo_postgres
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-wheretogo_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wheretogo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wheretogo-net

# -----------------------------------------------------------------------------
# Redes e Volumes Persistentes
# -----------------------------------------------------------------------------
networks:
  wheretogo-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
