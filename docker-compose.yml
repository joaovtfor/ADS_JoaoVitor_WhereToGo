services:
  # ---------------------------------------------------------------------------
  # Aplicação Full-Stack (Next.js 16 + Node.js)
  # ---------------------------------------------------------------------------
  app:
    container_name: wheretogo_app
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: runner # Altere para 'dev' caso deseje rodar em modo desenvolvimento com hot-reload
      args:
        NODE_VERSION: 20-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-wheretogo_db}?schema=public
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wheretogo-net

  # ---------------------------------------------------------------------------
  # Banco de Dados Relacional (PostgreSQL 16)
  # ---------------------------------------------------------------------------
  postgres:
    container_name: wheretogo_postgres
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-wheretogo_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wheretogo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wheretogo-net

# -----------------------------------------------------------------------------
# Redes e Volumes Persistentes
# -----------------------------------------------------------------------------
networks:
  wheretogo-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
